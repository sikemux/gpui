[package]
name = "gpui-pre-util-macros"
version = "0.3.10"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Utility macros for Zed"

[lints]
workspace = true

[lib]
name = "util_macros"
path = "src/util_macros.rs"
proc-macro = true
test = false

[dependencies]
quote.workspace = true
syn = { workspace = true, features = ["full", "extra-traits", "clone-impls", "parsing", "printing"] }
perf.workspace = true

[features]
perf-enabled = []
